name: Testar APK publicado em Android

on:
  push:
    branches: ['teste/apk-publicado-v1']
    paths:
      - '.github/workflows/test-apk-release.yml'
      - '.maestro/release.yaml'
      - 'tool/test_release.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Instalar e testar o APK da Release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MAESTRO_CLI_NO_ANALYTICS: 'true'
    steps:
      - name: Obter os testes
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Baixar o APK publicado e conferir integridade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded evidence
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern vozcidada.apk --dir downloaded
          echo 'fb2c533b703fa8efb10546487baae1548a32cfcbc3e79de2c165a97315b05117  downloaded/vozcidada.apk' | sha256sum --check
          sha256sum downloaded/vozcidada.apk > evidence/apk-sha256.txt
      - name: Instalar Maestro 2.12.1
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          maestro_bin=$(find "$RUNNER_TEMP/maestro-cli" -path '*/bin/maestro' -type f -print -quit)
          test -n "$maestro_bin"
          chmod +x "$maestro_bin"
          dirname "$maestro_bin" >> "$GITHUB_PATH"
      - name: Habilitar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Executar os fluxos no APK instalado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tool/test_release.sh
      - name: Disponibilizar resultados e capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teste-apk-publicado-android
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
