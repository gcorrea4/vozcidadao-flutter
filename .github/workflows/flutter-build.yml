name: Flutter - testes e APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analisar, testar e compilar Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
      - name: Instalar dependências
        run: flutter pub get
      - name: Conferir formatação
        run: dart format --output=none --set-exit-if-changed lib test tool
      - name: Analisar código
        run: flutter analyze --fatal-infos
      - name: Executar testes
        run: flutter test --reporter expanded
      - name: Compilar APK
        run: flutter build apk --release
      - name: Preparar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk vozcidada.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: vozcidada-apk
          path: vozcidada.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar APK da versão
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Conferir versão da tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          test "$TAG" = "v$version"
      - name: Baixar APK validado
        uses: actions/download-artifact@v4
        with:
          name: vozcidada-apk
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" vozcidada.apk --clobber
          else
            gh release create "$TAG" vozcidada.apk --verify-tag \
              --title "VozCidadã $TAG" --notes-file NOTAS_RELEASE.md
          fi
